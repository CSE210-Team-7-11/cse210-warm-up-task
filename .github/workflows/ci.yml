name: Check and deploy

on:
    pull_request:
    push:
        branches: [main, docs/jsdoc]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint

            - name: Check JavaScript types
              id: typecheck
              continue-on-error: true
              run: npm run typecheck -- --pretty false 2>&1 | tee "$RUNNER_TEMP/typecheck.txt"

            - name: Summarize JavaScript type diagnostics
              if: ${{ !cancelled() && (steps.typecheck.outcome == 'success' || steps.typecheck.outcome == 'failure') }}
              env:
                  TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
              run: |
                  type_diagnostics=$(awk '/error TS[0-9]+:/ { count++ } END { print count+0 }' "$RUNNER_TEMP/typecheck.txt")
                  printf '### JavaScript types\n\nStatus: %s (advisory)\n\nDiagnostics: %s\n\nFull output: `typecheck-results` artifact.\n' "$TYPECHECK_OUTCOME" "$type_diagnostics" >> "$GITHUB_STEP_SUMMARY"
                  if [ "$TYPECHECK_OUTCOME" = failure ]; then
                      echo "::warning::JavaScript type checking failed with $type_diagnostics diagnostics. See the typecheck-results artifact."
                  fi

            - name: Run unit tests with library coverage
              id: coverage
              run: npm run test:coverage

            - name: Generate the library reference
              id: jsdoc
              run: npm run docs:jsdoc

            - run: npm run build

            - name: Upload type diagnostics
              if: ${{ !cancelled() && (steps.typecheck.outcome == 'success' || steps.typecheck.outcome == 'failure') }}
              uses: actions/upload-artifact@v7
              with:
                  name: typecheck-results
                  path: ${{ runner.temp }}/typecheck.txt
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload library coverage
              if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
              uses: actions/upload-artifact@v7
              with:
                  name: library-coverage
                  path: coverage/lcov.info
                  retention-days: 30

            - name: Upload the library reference
              if: ${{ !cancelled() && steps.jsdoc.outcome == 'success' }}
              uses: actions/upload-artifact@v7
              with:
                  name: jsdoc-reference
                  path: docs/jsdoc/
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload the Pages build
              if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./dist

    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - name: Install Chromium and Firefox with system dependencies
              run: npx playwright install --with-deps chromium firefox
            - name: Run browser and accessibility tests
              id: browser-tests
              run: npm run test:e2e

            - name: Upload browser reports and failure details
              if: ${{ !cancelled() && (steps.browser-tests.outcome == 'success' || steps.browser-tests.outcome == 'failure') }}
              uses: actions/upload-artifact@v7
              with:
                  name: browser-results
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 30

    deploy:
        needs: [check, browser]
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v5
            - name: Deploy preview
              id: deployment
              uses: actions/deploy-pages@v4
